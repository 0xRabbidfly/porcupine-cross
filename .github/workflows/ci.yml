name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    # Enables manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Generate coverage report
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage/
        fail_ci_if_error: false

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Use Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: |
        mkdir -p dist/docs
        # The pages, the server rules and the crawler files; internal notes stay out
        cp *.html favicon.ico style.css script.js .htaccess robots.txt sitemap.xml dist/
        cp -r css js images sounds dist/
        # Only the public documents: the technical guide and the course GPX
        cp "docs/Prologue Cross Technical Guide.pdf" "docs/Prologue Cross 2026.gpx" dist/docs/
        # Stamp every ?v= with this commit, so each deploy busts the cache
        stamp="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
        sed -i -E "s/\?v=[A-Za-z0-9-]+/?v=${stamp}/g" dist/*.html
        echo "Stamped ?v=${stamp}"
        echo "STAMP=${stamp}" >> "$GITHUB_ENV"
        find dist -type f | wc -l

    - name: Verify build
      run: |
        for file in .htaccess robots.txt sitemap.xml index.html photos.html 404.html; do
          test -f "dist/$file" || { echo "Missing dist/$file"; exit 1; }
        done
        grep -q "?v=${STAMP}" dist/index.html || { echo "Version stamp did not apply"; exit 1; }

    - name: Deploy to production
      env:
        FTP_SERVER: server228.web-hosting.com
        FTP_USERNAME: rabbidfly@prologuecross.ca
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        node -e "
          const FtpDeploy = require('ftp-deploy');
          const ftpDeploy = new FtpDeploy();

          const config = {
            user: process.env.FTP_USERNAME,
            password: process.env.FTP_PASSWORD,
            host: process.env.FTP_SERVER,
            port: 21,
            localRoot: __dirname + '/dist/',
            remoteRoot: '/',
            // The glob skips dotfiles, so the server rules are named
            include: ['*', '**/*', '.htaccess'],
            exclude: [],
            deleteRemote: false,
            forcePasv: true,
            // FTPES with the host's certificate verified
            secure: true
          };

          console.log('Deploying to ' + config.host + ' as ' + config.user + ' (FTPES)');

          ftpDeploy.deploy(config)
            .then(() => console.log('Deployment complete!'))
            .catch(err => {
              console.error('Deployment failed:', err);
              process.exit(1);
            });
        "
