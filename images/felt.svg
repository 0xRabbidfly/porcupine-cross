<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!--
    Card-table felt. Fine fractal noise, desaturated, tiled seamlessly with
    stitchTiles so the weave carries across the whole table.
  -->
  <filter id="weave" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="220" height="220" filter="url(#weave)" opacity="0.5" />
</svg>
