    <style>
      /* Page-specific styling for photos page */
      body {
        padding-top: var(--header-height-desktop);
        background: var(--color-red-light);
        background-image: repeating-linear-gradient(
          135deg,
          rgba(214, 45, 32, 0.02) 0 12px,
          transparent 12px 24px
        );
      }

      .photos-page-container {
        width: 100%;
        margin: 0;
        padding: 40px 20px;
        min-height: calc(100vh - var(--header-height-desktop));
      }

      .photos-page-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .photos-page-header h1 {
        color: var(--color-secondary);
        font-family: var(--font-heading);
        font-size: 2.5rem;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .photos-page-header .ace-icon {
        color: var(--color-secondary);
        font-size: 1.3em;
        margin-right: 0.5em;
        font-family: 'Stardos Stencil', 'Cinzel', serif;
        display: inline-block;
        transform: rotate(-10deg);
        transition: transform 0.3s ease;
      }

      .photos-page-header:hover .ace-icon {
        transform: rotate(5deg) scale(1.1);
      }

      .photos-page-description {
        color: var(--color-dark);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto 20px auto;
        line-height: 1.6;
      }

      /* Event year index */
      .gallery-years {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 0 0 10px;
      }

      .gallery-year-btn {
        font-family: var(--font-heading);
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--color-secondary);
        background: rgba(255, 255, 255, 0.85);
        border: 2px solid var(--color-secondary);
        border-radius: 999px;
        padding: 8px 26px;
        cursor: pointer;
        transition:
          background-color 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .gallery-year-btn:hover {
        transform: translateY(-2px);
      }

      .gallery-year-btn[aria-selected='true'] {
        background: var(--color-secondary);
        color: #fff;
      }

      .gallery-placeholder {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        background: rgba(255, 255, 255, 0.85);
        border: 2px dashed var(--color-secondary);
        border-radius: 12px;
        color: var(--color-dark);
      }

      .gallery-retry {
        margin-top: 18px;
        padding: 9px 20px;
        font: inherit;
        cursor: pointer;
        color: var(--color-dark);
        background: transparent;
        border: 1px solid var(--color-secondary);
        border-radius: 4px;
      }

      .gallery-placeholder i {
        font-size: 2.5rem;
        color: var(--color-secondary);
        margin-bottom: 14px;
      }

      .gallery-placeholder h2 {
        font-family: var(--font-heading);
        font-size: 1.4rem;
        margin-bottom: 10px;
        color: var(--color-secondary);
      }

      .gallery-placeholder p {
        max-width: 520px;
        margin: 0 auto;
        line-height: 1.6;
      }

      /* Photo Gallery Styles */
      .gallery-stats {
        text-align: center;
        margin: 20px 0;
        font-size: 1.1rem;
        color: var(--color-secondary);
      }

      .gallery-stats .separator {
        margin: 0 10px;
        opacity: 0.5;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
        margin: 30px 0;
        padding: 0 10px;
      }

      .photo-item {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 1;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .photo-item:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* A photo that has not arrived yet is simply a card face down. Sized off
         .photo-item so the grid never reflows when the real photo replaces it. */
      .photo-skeleton {
        position: relative;
        aspect-ratio: 1;
        padding: 6px;
        border-radius: 3px;
        background: var(--pc-stock, #f7f2e7);
        box-shadow: 0 12px 22px -14px rgba(0, 0, 0, 0.9);
      }

      .photo-skeleton::after {
        content: '';
        position: absolute;
        inset: 6px;
        border-radius: 1px;
        background-color: var(--pc-royal, #1b3b8b);
        background-image: url('images/card-back.svg');
        /* Small enough that the guilloche reads as pattern rather than as a
           few stray circles at photo-tile size. */
        background-size: 44px 44px;
        animation: card-breathe 2.4s ease-in-out infinite;
      }

      /* Staggered so the grid breathes like a hand being shuffled rather than
         one slab blinking on and off. */
      .photo-skeleton:nth-child(3n + 2)::after {
        animation-delay: 0.3s;
      }

      .photo-skeleton:nth-child(3n)::after {
        animation-delay: 0.6s;
      }

      /* Stays a blue card back throughout. Dropping the opacity far enough to
         register as "loading" turned it grey, which is not a card. */
      @keyframes card-breathe {
        0%,
        100% {
          opacity: 0.78;
        }
        50% {
          opacity: 1;
        }
      }

      /* Each photo turns face up as it decodes. */
      .photo-item img {
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .photo-item img.is-loaded {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        .photo-skeleton::after {
          animation: none;
        }

        .photo-item img {
          transition: none;
        }
      }

      .scroll-sentinel {
        visibility: hidden;
      }

      /* Special animation for Photos menu item */
      nav a[href='photos.html'] {
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          var(--color-secondary),
          #ff6b35,
          var(--color-secondary)
        );
        background-size: 200% 100%;
        animation: photoMenuPulse 3s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        transform: scale(1.05);
        border: 2px solid rgba(255, 107, 53, 0.6);
      }

      nav a[href='photos.html']:before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
        animation: photoMenuGlint 2s ease-in-out infinite;
        animation-delay: 0.5s;
      }

      nav a[href='photos.html']:hover {
        animation-play-state: paused;
        background: linear-gradient(135deg, #ff6b35, var(--color-secondary), #ff6b35);
        box-shadow: 0 0 30px rgba(255, 107, 53, 0.7);
        transform: scale(1.08);
      }

      @keyframes photoMenuPulse {
        0%,
        100% {
          background-position: 0% 50%;
          box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
        }
        50% {
          background-position: 100% 50%;
          box-shadow: 0 0 30px rgba(255, 107, 53, 0.8);
        }
      }

      @keyframes photoMenuGlint {
        0% {
          left: -100%;
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          left: 100%;
          opacity: 0;
        }
      }

      /* Add sparkle effect */
      nav a[href='photos.html']:after {
        content: '✨';
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        animation: sparkle 1.5s ease-in-out infinite;
        font-size: 0.8rem;
      }

      @keyframes sparkle {
        0%,
        100% {
          opacity: 0.3;
          transform: translateY(-50%) scale(0.8);
        }
        50% {
          opacity: 1;
          transform: translateY(-50%) scale(1.2);
        }
      }

      .back-to-home {
        text-align: center;
        margin-top: 40px;
      }

      .back-to-home a {
        display: inline-block;
        background: linear-gradient(135deg, var(--color-secondary), #1e3a8a);
        color: white;
        text-decoration: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .back-to-home a:hover {
        background: linear-gradient(135deg, #3b82f6, #1e3a8a, #1e40af);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(30, 58, 138, 0.4);
      }

      /* Ultra-wide screens */
      @media (min-width: 1600px) {
        .photo-grid {
          grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 10px;
        }
      }

      @media (max-width: 768px) {
        body {
          padding-top: var(--header-height-mobile);
        }

        .photos-page-container {
          padding: 20px 15px;
          min-height: calc(100vh - var(--header-height-mobile));
        }

        .photos-page-header h1 {
          font-size: 2rem;
        }

        .photo-grid {
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 8px;
          padding: 0 5px;
        }
      }
    </style>

              <p style="margin-top: 10px; color: var(--color-medium)">Loading more photos...</p>
            </div>
          </div>
        </div>

        <!-- Back to Home -->
        <div class="back-to-home">
          <a href="index.html"> <i class="fas fa-arrow-left"></i> Back to Home </a>
        </div>
      </div>
    </main>

    <!-- Race replay: a category's race on the course map, lap by lap, opened
         by a [data-replay] button on the results board. -->
    <div class="race-replay" data-src="/photos/event-2026/replay/replay.json" hidden></div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" style="display: none">
      <div class="lightbox-content">
        <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightbox-image" src="" alt="" />
        <div class="lightbox-nav">
          <button id="lightbox-prev" class="lightbox-nav-btn" aria-label="Previous photo">‹</button>
          <button id="lightbox-next" class="lightbox-nav-btn" aria-label="Next photo">›</button>
        </div>
        <div class="lightbox-info">
          <div class="lightbox-caption">
            <h3 id="lightbox-title"></h3>
            <p id="lightbox-when" class="lightbox-when"></p>
            <p id="lightbox-credit" class="lightbox-credit"></p>
          </div>
          <a
            id="lightbox-download"
            href=""
            download
            class="download-btn"
            title="Download the full-size photo"
          >
            <i class="fas fa-download" aria-hidden="true"></i> Download
          </a>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
    <script type="module" src="js/main.js?v=20261024-3"></script>

    <!-- Photo Gallery Script -->
    <script>
      class PhotoGallery {
        constructor(year) {
          // allPhotos is the year; photos is what the grid and lightbox walk,
          // which is the year narrowed to the selected race.
          this.allPhotos = [];
          this.photos = [];
          this.photographers = [];
          this.raceStart = '';
          // A bib number narrows photos to one rider, across the year.
          this.bib = '';
          this.bibTimer = null;
          this.finder = document.querySelector('.bib-finder');
          this.riderPanel = document.querySelector('.rider-panel');
          // From the year's photos.json: bib -> result, and pairs of bibs
          // one rider raced under.
          this.results = {};
          this.sameRider = [];
          // The category the results board shows.
          this.standingsRace = '';
          this.fetching = false;
          this.currentPage = 0;
          this.photosPerPage = 50;
          this.currentPhotoIndex = 0;
          this.year = year;
          this.basePath = `/photos/event-${year}/`;
          this.isLoading = false;
          // Nothing to page through until the first page is drawn. On a tall
          // screen the scroll sentinel is in view before photos.json lands,
          // and paging then drew page two over the face-down cards, losing
          // the first twelve photos.
          this.hasMorePhotos = false;
          this.intersectionObserver = null;
          this.timeline = new DayTimeline(this);
          this.init();
        }

        async init() {
          this.selectRaceButton('');
          this.setupEventListeners();
          this.setupBibFinder();
          this.setupInfiniteScroll();
          await this.load();
        }

        async load() {
          let failure = null;
          this.fetching = true;
          this.timeline.render();

          try {
            await this.loadPhotos();
          } catch (error) {
            this.allPhotos = [];
            this.photos = [];
            // A missing photos.json is how a year with no gallery announces
            // itself. Anything else is a fault, and saying "coming soon" to
            // someone whose connection dropped is just wrong.
            failure = error.missingGallery ? null : error;
          }
          this.fetching = false;

          this.updateRaceCounts();
          this.updateStats();
          this.updateCredit();
          this.updateFinder();
          this.updateResults();
          this.timeline.render();

          if (failure) {
            this.showLoadError();
            return;
          }

          if (this.photos.length === 0) {
            this.showPlaceholder();
            return;
          }

          // A shared link to one rider's photos opens on them.
          const linked = new URLSearchParams(window.location.search).get('bib');
          if (linked && this.finder && !this.finder.hidden) {
            this.setBib(linked);
            return;
          }

          this.renderPhotos();
        }

        setYear(year) {
          if (year === this.year) return;

          this.year = year;
          this.basePath = `/photos/event-${year}/`;
          this.allPhotos = [];
          this.photos = [];
          this.photographers = [];
          this.currentPage = 0;
          this.currentPhotoIndex = 0;
          this.hasMorePhotos = false;
          this.results = {};
          this.sameRider = [];
          this.dropBib();
          this.selectRaceButton('');
          this.updateCredit();
          this.updateFinder();
          this.updateResults();
          this.timeline.render();
          this.showSkeletons();
          this.load();
        }

        // The race buttons for the current year, in start order. A year
        // without a race schedule has none, and the gallery is just the year.
        raceButtons() {
          return Array.from(
            document.querySelectorAll(`.gallery-races[data-year="${this.year}"] [data-start]`)
          )
            .filter(button => button.dataset.start)
            .sort((a, b) => Date.parse(a.dataset.start) - Date.parse(b.dataset.start));
        }

        // A race owns every photo from its start until the next race starts.
        // Photos taken before the first start belong to the first window.
        raceWindow(start) {
          const starts = this.raceButtons().map(button => Date.parse(button.dataset.start));
          const index = starts.indexOf(Date.parse(start));
          return {
            from: index === 0 ? -Infinity : starts[index],
            until: index + 1 < starts.length ? starts[index + 1] : Infinity,
          };
        }

        photosInRace(start) {
          if (!start) return this.allPhotos;

          const { from, until } = this.raceWindow(start);
          return this.allPhotos.filter(photo => {
            const taken = Date.parse(photo.date_taken);
            return taken >= from && taken < until;
          });
        }

        // The race button whose window holds the photo, or null in a year
        // without a race schedule.
        raceFor(photo) {
          const taken = Date.parse(photo.date_taken);
          return (
            this.raceButtons().find(button => {
              const { from, until } = this.raceWindow(button.dataset.start);
              return taken >= from && taken < until;
            }) || null
          );
        }

        // "11:18 am, 18 minutes in": when the photo was taken, as a racer
        // would place it. Empty in a year without a race schedule, whose
        // timestamps were never checked against the clock.
        describeMoment(photo) {
          const race = this.raceFor(photo);
          if (!race) return '';

          const taken = Date.parse(photo.date_taken);
          const minutes = Math.floor((taken - Date.parse(race.dataset.start)) / 60000);
          let into = `${minutes} minutes in`;
          if (minutes < 0) into = 'before the start';
          else if (minutes === 0) into = 'at the start';
          else if (minutes === 1) into = '1 minute in';
          return `${formatClock(taken)}, ${into}`;
        }

        selectRaceButton(start) {
          this.raceStart = start;
          document.querySelectorAll('.gallery-races').forEach(group => {
            group.hidden = group.dataset.year !== this.year;
          });
          document.querySelectorAll('.gallery-race-btn').forEach(button => {
            button.setAttribute('aria-pressed', String(button.dataset.start === start));
          });
          if (this.timeline) this.timeline.select();
        }

        updateCredit() {
          const credit = document.getElementById('gallery-credit');
          const names = this.photographers.map(photographer => photographer.name);
          credit.hidden = names.length === 0;
          credit.textContent = names.length
            ? `Photographed by ${new Intl.ListFormat('en', { type: 'conjunction' }).format(names)}`
            : '';
        }

        // Opened from the timeline: stay in the selected race when the photo
        // is in it, otherwise move to the race it belongs to.
        openPhoto(photo) {
          if (!this.photos.includes(photo)) {
            const race = this.raceFor(photo);
            this.setRace(race ? race.dataset.start : '');
          }
          this.openLightbox(this.photos.indexOf(photo));
        }

        // Choosing a race leaves bib search, even the race already lit for
        // the bib: the tab then means "everyone in this race".
        setRace(start) {
          if (start === this.raceStart && !this.bib) return;

          this.dropBib();
          this.selectRaceButton(start);
          // Still loading: loadPhotos applies the selection when it lands.
          if (this.allPhotos.length === 0) return;

          this.photos = this.photosInRace(start);
          this.showSelection(() => this.showEmptyRace());
        }

        // Draws whatever photos now holds: the count, the timeline and the
        // grid, or the empty state when there is nothing to draw.
        showSelection(showEmpty) {
          this.currentPage = 0;
          this.currentPhotoIndex = 0;
          this.updateStats();
          this.updateRider();
          this.updateResults();
          this.timeline.select();

          if (this.photos.length === 0) {
            showEmpty();
            return;
          }

          this.renderPhotos();
        }

        updateFinder() {
          if (!this.finder) return;
          this.finder.hidden =
            this.finder.dataset.year !== this.year || !this.allPhotos.some(photo => photo.bibs);
        }

        // One rider's photos, in the order they were taken, with their race
        // lit on the deck. A rider races once, so the first photo's race is
        // theirs. An empty number goes back to that race.
        setBib(value) {
          const bib = String(value)
            .replace(/\D/g, '')
            .replace(/^0+(?=\d)/, '');
          clearTimeout(this.bibTimer);
          if (this.bibInput.value !== bib) this.bibInput.value = bib;
          this.bibClear.hidden = !bib;
          if (bib === this.bib) return;

          this.bib = bib;
          this.updateBibUrl();

          if (!bib) {
            this.photos = this.photosInRace(this.raceStart);
            this.showSelection(() => this.showEmptyRace());
            return;
          }

          this.photos = this.allPhotos.filter(photo => photo.bibs && photo.bibs[bib]);
          const race = this.photos.length ? this.raceFor(this.photos[0]) : null;
          this.selectRaceButton(race ? race.dataset.start : '');
          this.showSelection(() => this.showNoBib());
        }

        // Leaves bib search without redrawing, for a caller about to.
        dropBib() {
          if (!this.finder) return;
          clearTimeout(this.bibTimer);
          this.bibInput.value = '';
          this.bibClear.hidden = true;
          if (!this.bib) return;
          this.bib = '';
          this.updateBibUrl();
          this.updateRider();
        }

        // "2nd of 9 in Master Men 35+" and "42:00 over 6 laps", or what is
        // known when the rider did not finish. Empty without a result.
        riderResult(bib) {
          const result = this.results[bib];
          if (!result) return { headline: '', detail: '' };
          if (result.status === 'DNF') {
            return { headline: `Raced ${result.race}`, detail: 'Did not finish' };
          }
          if (!result.place) return { headline: '', detail: '' };
          return {
            headline: `${ordinal(result.place)} of ${result.field} in ${result.race}`,
            detail: `${result.time} over ${result.laps} laps`,
          };
        }

        // Which lap a photo caught the searched rider on, worked out from
        // their start, finishing time and laps: an even split, so a frame
        // right at the line can land a lap early or late.
        lapFor(photo) {
          const result = this.results[this.bib];
          if (!result || !result.laps) return '';
          const start = Date.parse(result.start);
          const taken = Date.parse(photo.date_taken);
          const total = clockSeconds(result.time) * 1000;
          if (taken < start) return 'Start';
          if (taken > start + total) return 'Finished';
          const lap = Math.floor((taken - start) / (total / result.laps)) + 1;
          return `Lap ${Math.min(result.laps, lap)}`;
        }

        // The rider's other bib, when they raced twice.
        otherBib(bib) {
          const pair = this.sameRider.find(bibs => bibs.includes(bib));
          return pair ? pair.find(other => other !== bib) : '';
        }

        // Riders tagged in the same frames, most shared first.
        racedWith(bib) {
          const other = this.otherBib(bib);
          const counts = new Map();
          this.photos.forEach(photo => {
            Object.keys(photo.bibs || {}).forEach(tagged => {
              if (tagged === bib || tagged === other) return;
              counts.set(tagged, (counts.get(tagged) || 0) + 1);
            });
          });
          return Array.from(counts)
            .sort((a, b) => b[1] - a[1] || Number(a[0]) - Number(b[0]))
            .slice(0, 4);
        }

        updateRider() {
          const panel = this.riderPanel;
          if (!panel) return;
          panel.hidden = !this.bib || this.photos.length === 0;
          if (panel.hidden) return;

          const { headline, detail } = this.riderResult(this.bib);
          const count = this.photos.length;
          const bytes = this.photos.reduce((total, photo) => total + (photo.size_bytes || 0), 0);
          panel.querySelector('.rider-zip-label').textContent =
            count === 1 ? 'Download the photo' : `Download all ${count} photos`;
          panel.querySelector('.rider-zip-size').textContent = bytes ? megabytes(bytes) : '';
          panel.querySelector('.rider-bib').textContent = this.bib;
          panel.querySelector('.rider-result').textContent = headline || `Bib ${this.bib}`;
          panel.querySelector('.rider-detail').textContent = detail;

          const links = panel.querySelector('.rider-links');
          links.textContent = '';
          const link = (bib, text) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'rider-link';
            button.innerHTML = text;
            button.addEventListener('click', () => this.setBib(bib));
            return button;
          };

          const other = this.otherBib(this.bib);
          if (other && this.results[other]) {
            const row = document.createElement('p');
            row.className = 'rider-links-row';
            row.appendChild(
              link(other, `Also raced ${this.results[other].race} as <b>${other}</b>`)
            );
            links.appendChild(row);
          }

          const rivals = this.racedWith(this.bib);
          if (rivals.length) {
            const row = document.createElement('p');
            row.className = 'rider-links-row';
            const label = document.createElement('span');
            label.className = 'rider-links-label';
            label.textContent = 'In the frame with';
            row.appendChild(label);
            rivals.forEach(([bib, shared]) => {
              row.appendChild(
                link(bib, `<b>${bib}</b> ${shared === 1 ? '1 photo' : `${shared} photos`}`)
              );
            });
            links.appendChild(row);
          }
        }

        // Three of the rider's photos for the card: the frames they fill
        // most, at least two minutes apart so a burst of one corner does not
        // take every print, laid out in the order they were taken.
        cardPhotos() {
          const ranked = this.photos.slice().sort(byCloseUp(this.bib));
          const apart = photo =>
            picked.every(
              other =>
                Math.abs(Date.parse(photo.date_taken) - Date.parse(other.date_taken)) >= 120000
            );
          const picked = [];
          ranked.forEach(photo => {
            if (picked.length < 3 && apart(photo)) picked.push(photo);
          });
          ranked.forEach(photo => {
            if (picked.length < 3 && !picked.includes(photo)) picked.push(photo);
          });
          return picked.sort((a, b) => Date.parse(a.date_taken) - Date.parse(b.date_taken));
        }

        async makeCard() {
          const button = this.riderPanel.querySelector('.rider-card-btn');
          const label = button.querySelector('span');
          button.disabled = true;
          label.textContent = 'Making your card…';
          try {
            const photos = this.cardPhotos();
            const credits = [...new Set(photos.map(photo => photo.photographer).filter(Boolean))];
            const { headline, detail } = this.riderResult(this.bib);
            const blob = await drawRiderCard({
              year: this.year,
              bib: this.bib,
              headline,
              detail,
              credits,
              sources: photos.map(photo => `${this.basePath}high-res/${photo.filename}`),
            });
            const name = `Prologue${this.year}_bib${this.bib}.jpg`;
            const file = new File([blob], name, { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: `Prologue Cross ${this.year}` });
            } else {
              const anchor = document.createElement('a');
              anchor.href = URL.createObjectURL(blob);
              anchor.download = name;
              anchor.click();
              setTimeout(() => URL.revokeObjectURL(anchor.href), 10000);
            }
          } catch (error) {
            // Closing the share sheet is a choice, not a failure.
            if (error.name !== 'AbortError') console.warn('Photo card failed', error);
          } finally {
            button.disabled = false;
            label.textContent = 'Make my photo card';
          }
        }

        // Every photo of the rider in one zip, in the order they were taken,
        // fetched three at a time with the count on the button.
        async downloadAll() {
          const button = this.riderPanel.querySelector('.rider-zip-btn');
          const label = button.querySelector('.rider-zip-label');
          const photos = this.photos.slice();
          const bib = this.bib;
          const width = String(photos.length).length;
          const files = [];
          let next = 0;
          let done = 0;
          const fetchNext = async () => {
            while (next < photos.length) {
              const index = next++;
              const photo = photos[index];
              const response = await fetch(`${this.basePath}high-res/${photo.filename}`);
              if (!response.ok) throw new Error(`HTTP ${response.status} for ${photo.filename}`);
              files[index] = {
                name: `${String(index + 1).padStart(width, '0')}_${this.downloadName(photo)}`,
                data: new Uint8Array(await response.arrayBuffer()),
                date: new Date(photo.date_taken),
              };
              done += 1;
              if (this.bib === bib) label.textContent = `Fetching ${done} of ${photos.length}…`;
            }
          };

          button.disabled = true;
          label.textContent = `Fetching 0 of ${photos.length}…`;
          try {
            await Promise.all([fetchNext(), fetchNext(), fetchNext()]);
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(
              new Blob(zipParts(files), { type: 'application/zip' })
            );
            anchor.download = `Prologue${this.year}_bib${bib}.zip`;
            anchor.click();
            setTimeout(() => URL.revokeObjectURL(anchor.href), 60000);
            this.updateRider();
          } catch (error) {
            console.warn('Photo download failed', error);
            if (this.bib === bib) label.textContent = 'Download stopped. Try again';
          } finally {
            button.disabled = false;
          }
        }

        // The photographer's name travels with the file once it leaves the site.
        downloadName(photo) {
          return [
            `Prologue${this.year}`,
            photo.photographer && photo.photographer.replace(/[^A-Za-z]/g, ''),
            photo.filename,
          ]
            .filter(Boolean)
            .join('_');
        }

        // The year's results by category, in start order: the selected
        // race's categories, or all of them under All. Finishers by place,
        // then the riders who did not finish. Riders who never started are
        // left out.
        resultGroups() {
          const span = this.raceStart ? this.raceWindow(this.raceStart) : null;
          const byRace = new Map();
          Object.entries(this.results).forEach(([bib, result]) => {
            if (result.status === 'DNS') return;
            const start = Date.parse(result.start);
            if (span && (start < span.from || start >= span.until)) return;
            if (!byRace.has(result.race)) byRace.set(result.race, []);
            byRace.get(result.race).push({ bib, ...result });
          });
          return Array.from(byRace, ([race, riders]) => ({
            race,
            start: Date.parse(riders[0].start),
            riders: riders.sort(
              (a, b) =>
                (a.place || Infinity) - (b.place || Infinity) || Number(a.bib) - Number(b.bib)
            ),
          })).sort((a, b) => a.start - b.start || a.race.localeCompare(b.race));
        }

        // Shown with the race tabs, folded until asked for, and put away
        // during a bib search, when the rider panel has the floor.
        updateResults() {
          const board = document.querySelector('.race-results');
          if (!board) return;
          const groups = this.resultGroups();
          board.hidden = Boolean(this.bib) || groups.length === 0;
          if (board.hidden) return;

          const race = this.raceButtons().find(button => button.dataset.start === this.raceStart);
          board.querySelector('.race-results-title').textContent = race
            ? `Results: ${raceName(race)}`
            : 'Results';

          const tagged = new Map();
          this.allPhotos.forEach(photo => {
            Object.keys(photo.bibs || {}).forEach(bib => {
              if (!tagged.has(bib)) tagged.set(bib, []);
              tagged.get(bib).push(photo);
            });
          });

          // One category at a time, picked from a dropdown on one line, so
          // the board stays a table and not a scroll. A race change keeps the
          // pick when the category is still on the board.
          const shown = groups.find(group => group.race === this.standingsRace) || groups[0];
          this.standingsRace = shown.race;
          const options = groups
            .map(({ race: category, riders }) => {
              const finished = riders.filter(rider => rider.place).length;
              const selected = category === shown.race ? ' selected' : '';
              return `<option value="${category}"${selected}>${category} (${finished})</option>`;
            })
            .join('');

          const { riders } = shown;
          const winner = riders[0];
          // Categories with a lap-by-lap replay (js/components/raceReplay.js).
          const replays = (board.dataset.replays || '').split(',').filter(Boolean);
          const rows = riders
            .map(rider => {
              const photos = tagged.get(rider.bib) || [];
              const thumb = photos.slice().sort(byCloseUp(rider.bib))[0];
              const cell = thumb
                ? `<button type="button" data-bib="${rider.bib}" aria-label="${photos.length} photos of bib ${rider.bib}">
                     <img src="${this.basePath}thumbnails/${thumb.filename}" alt="" loading="lazy" />
                     <span>${photos.length}</span>
                   </button>`
                : '<span class="standings-none">None</span>';
              const podium = rider.place && rider.place <= 3 ? ' is-podium' : '';
              return `<tr${thumb ? ` class="is-linked" data-bib="${rider.bib}"` : ''}>
                  <td class="standings-place${podium}">${rider.place || rider.status}</td>
                  <td class="standings-bib">${rider.bib}</td>
                  <td class="standings-time">${rider.time || ''}</td>
                  <td class="standings-gap">${gapText(rider, winner)}</td>
                  <td class="standings-photos">${cell}</td>
                </tr>`;
            })
            .join('');

          board.querySelector('.race-results-body').innerHTML = `
            <div class="standings-head">
              <label class="standings-pick">
                <span class="sr-only">Category</span>
                <select class="standings-select">${options}</select>
              </label>
              ${replays.includes(shown.race) ? `<button type="button" class="standings-replay" data-replay="${shown.race}"><i class="fas fa-play" aria-hidden="true"></i> Watch the race</button>` : ''}
              ${closestFinish(riders)}
            </div>
            <table class="standings-table">
              <thead><tr><th>Place</th><th>Bib</th><th>Time</th><th>Gap</th><th>Photos</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>`;
        }

        // From the results to a rider's photos, with their panel in view.
        pickRider(bib) {
          this.setBib(bib);
          if (this.riderPanel && !this.riderPanel.hidden && this.riderPanel.scrollIntoView) {
            this.riderPanel.scrollIntoView({ block: 'start', behavior: 'smooth' });
          }
        }

        // The address carries the bib, so a rider's photos can be shared.
        updateBibUrl() {
          const url = new URL(window.location.href);
          if (this.bib) url.searchParams.set('bib', this.bib);
          else url.searchParams.delete('bib');
          window.history.replaceState(null, '', url);
        }

        setupBibFinder() {
          if (!this.finder) return;
          this.bibInput = this.finder.querySelector('#bib-input');
          this.bibClear = this.finder.querySelector('.bib-clear');

          this.finder.addEventListener('submit', event => {
            event.preventDefault();
            this.setBib(this.bibInput.value);
          });

          this.bibInput.addEventListener('input', () => {
            const digits = this.bibInput.value.replace(/\D/g, '');
            if (digits !== this.bibInput.value) this.bibInput.value = digits;
            this.bibClear.hidden = !digits;
            clearTimeout(this.bibTimer);
            // Wait for the whole number: "2" on the way to "204" is someone else.
            this.bibTimer = setTimeout(() => this.setBib(digits), 450);
          });

          this.bibInput.addEventListener('keydown', event => {
            if (event.key === 'Escape' && this.bibInput.value) {
              event.preventDefault();
              this.setBib('');
            }
          });

          this.bibClear.addEventListener('click', () => {
            this.setBib('');
            this.bibInput.focus();
          });

          if (this.riderPanel) {
            this.riderPanel
              .querySelector('.rider-card-btn')
              .addEventListener('click', () => this.makeCard());
            this.riderPanel
              .querySelector('.rider-zip-btn')
              .addEventListener('click', () => this.downloadAll());
          }

          const board = document.querySelector('.race-results-body');
          if (board) {
            board.addEventListener('click', event => {
              const row = event.target.closest('[data-bib]');
              if (row) this.pickRider(row.dataset.bib);
            });
            board.addEventListener('change', event => {
              if (!event.target.matches('.standings-select')) return;
              this.standingsRace = event.target.value;
              this.updateResults();
              board.querySelector('.standings-select').focus();
            });
          }
        }

        showNoBib() {
          this.hasMorePhotos = false;
          this.hideLoadingIndicator();
          const grid = document.getElementById('photo-grid');
          grid.innerHTML = `
                    <div class="gallery-placeholder">
                        <i class="fas fa-magnifying-glass"></i>
                        <h2>No photos found for bib ${this.bib}</h2>
                        <p>
                            Riders are found by the number on their bib, or by their kit
                            when the number is hidden, so a few photos slip through.
                            ${this.finder.dataset.untagged || ''} Every photo is still under
                            its race above.
                        </p>
                        <button type="button" class="gallery-retry">Show all photos</button>
                    </div>
                `;
          grid.querySelector('.gallery-retry').addEventListener('click', () => this.setRace(''));
        }

        updateRaceCounts() {
          document
            .querySelectorAll(`.gallery-races[data-year="${this.year}"] .gallery-race-btn`)
            .forEach(button => {
              let count = button.querySelector('.race-count');
              if (!count) {
                count = document.createElement('span');
                count.className = 'race-count';
                button.appendChild(count);
              }
              const inRace = this.photosInRace(button.dataset.start).length;
              count.textContent = this.allPhotos.length ? String(inRace) : '';
              button.hidden = Boolean(button.dataset.start) && this.allPhotos.length > 0 && !inRace;
            });
        }

        showEmptyRace() {
          this.hasMorePhotos = false;
          this.hideLoadingIndicator();
          document.getElementById('photo-grid').innerHTML = `
                    <div class="gallery-placeholder">
                        <i class="fas fa-camera-retro"></i>
                        <h2>No photos from this race</h2>
                        <p>Nothing was shot in this window. Try the race before or after it.</p>
                    </div>
                `;
        }

        // Twelve is about two rows on a desktop grid and six on a phone: enough
        // to say "photos go here" without pretending to know the real count.
        showSkeletons() {
          document.getElementById('photo-grid').innerHTML =
            '<div class="photo-skeleton"></div>'.repeat(12);
        }

        async loadPhotos() {
          // Without a deadline a stalled request leaves the gallery spinning
          // for as long as the reader is willing to wait, with nothing to read
          // and nothing to press.
          const controller = new AbortController();
          const deadline = setTimeout(() => controller.abort(), 15000);

          try {
            const response = await fetch(this.basePath + 'photos.json', {
              signal: controller.signal,
            });
            if (!response.ok) {
              const error = new Error(`HTTP ${response.status}: ${response.statusText}`);
              error.missingGallery = response.status === 404;
              throw error;
            }
            const data = await response.json();
            this.allPhotos = data.photos || [];
            // A year with a race schedule had its clocks checked, so its
            // photos tell the day in order. Two cameras' files sort apart by
            // name, which would put one photographer's whole day first.
            if (this.raceButtons().length) {
              this.allPhotos.sort((a, b) => Date.parse(a.date_taken) - Date.parse(b.date_taken));
            }
            this.photographers = data.photographers || [];
            this.results = data.results || {};
            this.sameRider = data.same_rider || [];
            this.photos = this.photosInRace(this.raceStart);
          } finally {
            clearTimeout(deadline);
          }
        }

        showPlaceholder() {
          this.hasMorePhotos = false;
          this.hideLoadingIndicator();
          document.getElementById('photo-grid').innerHTML = `
                    <div class="gallery-placeholder">
                        <i class="fas fa-camera-retro"></i>
                        <h2>Photos Coming Soon</h2>
                        <p>
                            Race-day photos from ${this.year} are not published yet. Check back after
                            the event, or browse a previous year using the buttons above.
                        </p>
                    </div>
                `;
        }

        showLoadError() {
          this.hasMorePhotos = false;
          this.hideLoadingIndicator();
          const grid = document.getElementById('photo-grid');
          grid.innerHTML = `
                    <div class="gallery-placeholder">
                        <i class="fas fa-triangle-exclamation"></i>
                        <h2>Photos didn't load</h2>
                        <p>
                            The ${this.year} gallery could not be reached. Check your connection
                            and try again.
                        </p>
                        <button type="button" class="gallery-retry">Try again</button>
                    </div>
                `;
          grid.querySelector('.gallery-retry').addEventListener('click', () => {
            this.showSkeletons();
            this.load();
          });
        }

        // "197 photos from Men C and Masters 55+", "12 photos of bib 204,
        // 4 matched by kit", or the year's total.
        updateStats() {
          const count = this.photos.length;
          const race = this.raceButtons().find(button => button.dataset.start === this.raceStart);
          let text = count === 1 ? '1 photo' : `${count} photos`;
          if (this.bib) {
            const byKit = this.photos.filter(photo => photo.bibs[this.bib] === 'kit').length;
            text = count ? `${text} of bib ${this.bib}` : `No photos of bib ${this.bib}`;
            if (byKit) text += `, ${byKit} matched by kit`;
          } else if (race) {
            text += ` from ${raceName(race)}`;
          }
          if (this.allPhotos.length === 0) text = 'No photos yet';
          document.getElementById('photo-count').textContent = text;
        }

        renderPhotos() {
          const grid = document.getElementById('photo-grid');
          const startIndex = this.currentPage * this.photosPerPage;
          const endIndex = startIndex + this.photosPerPage;
          const photosToShow = this.photos.slice(0, endIndex);

          // Clear the face-down cards on first load only
          if (this.currentPage === 0) {
            grid.innerHTML = '';
          }

          // Add new photos from the last rendered index
          const lastRenderedIndex = grid.children.length;
          const newPhotos = photosToShow.slice(lastRenderedIndex);

          newPhotos.forEach((photo, index) => {
            const photoIndex = lastRenderedIndex + index;
            const photoItem = document.createElement('div');
            photoItem.className = 'photo-item';

            const img = document.createElement('img');
            img.loading = 'lazy';
            img.alt = `Event Photo ${photo.id}`;
            // Listeners before src, so a cached thumbnail cannot finish loading
            // before anything is listening and get stuck at opacity 0.
            img.addEventListener('load', () => img.classList.add('is-loaded'));
            img.addEventListener('error', () => {
              img.style.display = 'none';
            });
            img.src = `${this.basePath}thumbnails/${photo.filename}`;
            photoItem.appendChild(img);

            // The number is hidden in this one; the kit matched.
            if (this.bib && photo.bibs[this.bib] === 'kit') {
              const tag = document.createElement('span');
              tag.className = 'photo-tag';
              tag.textContent = 'Likely you';
              tag.title = 'Matched by kit: the number is not visible in this photo';
              photoItem.appendChild(tag);
            }

            const lap = this.bib ? this.lapFor(photo) : '';
            if (lap) {
              const mark = document.createElement('span');
              mark.className = 'photo-lap';
              mark.textContent = lap;
              photoItem.appendChild(mark);
            }

            photoItem.addEventListener('click', () => this.openLightbox(photoIndex));
            grid.appendChild(photoItem);
          });

          // Check if we have more photos to load
          this.hasMorePhotos = endIndex < this.photos.length;

          // Hide loading indicator
          this.hideLoadingIndicator();
        }

        loadMorePhotos() {
          if (this.isLoading || !this.hasMorePhotos) return;

          this.isLoading = true;
          this.showLoadingIndicator();
          this.currentPage++;

          // Simulate network delay for better UX
          setTimeout(() => {
            this.renderPhotos();
            this.isLoading = false;
          }, 300);
        }

        setupInfiniteScroll() {
          const sentinel = document.getElementById('scroll-sentinel');

          this.intersectionObserver = new IntersectionObserver(
            entries => {
              entries.forEach(entry => {
                if (entry.isIntersecting && this.hasMorePhotos && !this.isLoading) {
                  this.loadMorePhotos();
                }
              });
            },
            {
              root: null,
              rootMargin: '100px', // Start loading 100px before the sentinel is visible
              threshold: 0.1,
            }
          );

          this.intersectionObserver.observe(sentinel);
        }

        showLoadingIndicator() {
          const loadingMore = document.querySelector('.loading-more');
          if (loadingMore) loadingMore.style.display = 'block';
        }

        hideLoadingIndicator() {
          const loadingMore = document.querySelector('.loading-more');
          if (loadingMore) loadingMore.style.display = 'none';
        }

        openLightbox(index) {
          this.currentPhotoIndex = index;
          const photo = this.photos[index];
          const lightbox = document.getElementById('lightbox');
          const lightboxImage = document.getElementById('lightbox-image');
          const lightboxTitle = document.getElementById('lightbox-title');
          const lightboxDownload = document.getElementById('lightbox-download');
          const race = this.raceFor(photo);
          const title = race ? raceName(race) : `Prologue Cyclocross ${this.year}`;

          lightboxImage.src = this.basePath + 'high-res/' + photo.filename;
          lightboxImage.alt = `${title} race photo`;
          lightboxTitle.textContent = title;
          document.getElementById('lightbox-when').textContent = this.describeMoment(photo);
          document.getElementById('lightbox-credit').textContent = photo.photographer
            ? `Photo by ${photo.photographer}`
            : '';
          lightboxDownload.href = this.basePath + 'high-res/' + photo.filename;
          lightboxDownload.download = this.downloadName(photo);

          lightbox.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        }

        closeLightbox() {
          document.getElementById('lightbox').style.display = 'none';
          document.body.style.overflow = 'auto';
        }

        nextPhoto() {
          if (this.currentPhotoIndex < this.photos.length - 1) {
            this.openLightbox(this.currentPhotoIndex + 1);
          }
        }

        prevPhoto() {
          if (this.currentPhotoIndex > 0) {
            this.openLightbox(this.currentPhotoIndex - 1);
          }
        }

        setupEventListeners() {
          // Lightbox controls
          document.querySelector('.lightbox-close').addEventListener('click', () => {
            this.closeLightbox();
          });

          document.getElementById('lightbox-next').addEventListener('click', () => {
            this.nextPhoto();
          });

          document.getElementById('lightbox-prev').addEventListener('click', () => {
            this.prevPhoto();
          });

          // Close lightbox on background click
          const lightbox = document.getElementById('lightbox');
          lightbox.addEventListener('click', e => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
              this.closeLightbox();
            }
          });

          // On a phone, swipe sideways between photos.
          let swipeX = null;
          lightbox.addEventListener(
            'touchstart',
            e => {
              swipeX = e.touches.length === 1 ? e.touches[0].clientX : null;
            },
            { passive: true }
          );
          lightbox.addEventListener('touchend', e => {
            if (swipeX === null) return;
            const dx = e.changedTouches[0].clientX - swipeX;
            swipeX = null;
            if (Math.abs(dx) < 50) return;
            if (dx < 0) this.nextPhoto();
            else this.prevPhoto();
          });

          // Keyboard navigation
          document.addEventListener('keydown', e => {
            if (document.getElementById('lightbox').style.display === 'flex') {
              switch (e.key) {
                case 'Escape':
                  this.closeLightbox();
                  break;
                case 'ArrowLeft':
                  this.prevPhoto();
                  break;
                case 'ArrowRight':
                  this.nextPhoto();
                  break;
              }
            }
          });
        }
      }

      // Race-day clock time, "11:18 am", in the time zone the race ran in.
      function formatClock(time) {
        const parts = new Intl.DateTimeFormat('en-US', {
          hour: 'numeric',
          minute: '2-digit',
          timeZone: 'America/Toronto',
        }).formatToParts(new Date(time));
        const part = type => parts.find(p => p.type === type).value;
        return `${part('hour')}:${part('minute')} ${part('dayPeriod').toLowerCase()}`;
      }

      // 1 -> "1st", 22 -> "22nd", 13 -> "13th".
      function ordinal(n) {
        const tens = n % 100;
        const suffix =
          tens >= 11 && tens <= 13 ? 'th' : { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th';
        return `${n}${suffix}`;
      }

      // "42:16" or "1:02:07" -> seconds.
      function clockSeconds(text) {
        return text.split(':').reduce((total, part) => total * 60 + Number(part), 0);
      }

      // 73 -> "1:13", 3725 -> "1:02:05".
      function formatDuration(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = String(seconds % 60).padStart(2, '0');
        return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
      }

      // "+0:13" behind the winner, or "1 lap down". Empty for the winner and
      // for a rider who did not finish.
      function gapText(rider, winner) {
        if (rider === winner || !rider.place) return '';
        const down = winner.laps - rider.laps;
        if (down > 0) return down === 1 ? '1 lap down' : `${down} laps down`;
        return `+${formatDuration(clockSeconds(rider.time) - clockSeconds(winner.time))}`;
      }

      // The tightest finish between two riders on the same lap, when it was
      // within ten seconds: the race worth looking at the photos of.
      function closestFinish(riders) {
        let best = null;
        riders.forEach((rider, i) => {
          const ahead = riders[i - 1];
          if (!ahead || !rider.place || !ahead.place || rider.laps !== ahead.laps) return;
          const gap = clockSeconds(rider.time) - clockSeconds(ahead.time);
          if (gap <= 10 && (!best || gap < best.gap)) best = { ahead, rider, gap };
        });
        if (!best) return '';
        const apart =
          best.gap === 0
            ? 'on the same time'
            : best.gap === 1
              ? '1 second apart'
              : `${best.gap} seconds apart`;
        const bib = b =>
          `<button type="button" class="rider-link" data-bib="${b}"><b>${b}</b></button>`;
        return `<p class="standings-closest">Closest finish: ${bib(best.ahead.bib)} and ${bib(best.rider.bib)}, ${apart}</p>`;
      }

      // Sorts a rider's photos close-ups first: by how much of the frame they
      // fill, with a read number ahead of a kit match, which is a guess.
      function byCloseUp(bib) {
        const score = photo =>
          ((photo.sizes && photo.sizes[bib]) || 0) * (photo.bibs[bib] === 'number' ? 1 : 0.8);
        const read = photo => (photo.bibs[bib] === 'number' ? 0 : 1);
        return (a, b) => score(b) - score(a) || read(a) - read(b);
      }

      // 34123456 -> "34 MB".
      function megabytes(bytes) {
        return `${Math.max(1, Math.round(bytes / 1e6))} MB`;
      }

      // A zip with each file stored as it is: JPEGs are already compressed,
      // so storing them costs nothing and needs no library. ASCII names, and
      // under 4 GB in all. Returns the parts, for a Blob.
      function zipParts(files) {
        const table = Array.from({ length: 256 }, (_, n) => {
          let c = n;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          return c >>> 0;
        });
        const crc32 = bytes => {
          let c = 0xffffffff;
          for (let i = 0; i < bytes.length; i++) c = table[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
          return (c ^ 0xffffffff) >>> 0;
        };
        // Little-endian fields, each [byte width, value].
        const record = fields => {
          const view = new DataView(new ArrayBuffer(fields.reduce((n, [w]) => n + w, 0)));
          let at = 0;
          fields.forEach(([w, value]) => {
            if (w === 2) view.setUint16(at, value, true);
            else view.setUint32(at, value, true);
            at += w;
          });
          return new Uint8Array(view.buffer);
        };

        const entries = [];
        const directory = [];
        let offset = 0;
        files.forEach(({ name, data, date = new Date() }) => {
          const nameBytes = Uint8Array.from(name, ch => ch.charCodeAt(0) & 0x7f);
          const time =
            (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
          const day =
            ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
          // Version needed, flags, method (stored), time, date, CRC, both
          // sizes, name length, extra length: the same in both headers.
          const common = [
            [2, 20],
            [2, 0],
            [2, 0],
            [2, time],
            [2, day],
            [4, crc32(data)],
            [4, data.length],
            [4, data.length],
            [2, nameBytes.length],
            [2, 0],
          ];
          const local = record([[4, 0x04034b50], ...common]);
          entries.push(local, nameBytes, data);
          directory.push(
            record([
              [4, 0x02014b50],
              [2, 20],
              ...common,
              [2, 0],
              [2, 0],
              [2, 0],
              [4, 0],
              [4, offset],
            ]),
            nameBytes
          );
          offset += local.length + nameBytes.length + data.length;
        });
        const size = directory.reduce((total, part) => total + part.length, 0);
        const end = record([
          [4, 0x06054b50],
          [2, 0],
          [2, 0],
          [2, files.length],
          [2, files.length],
          [4, size],
          [4, offset],
          [2, 0],
        ]);
        return [...entries, ...directory, end];
      }

      // The rider's photo card: a 1080x1920 story image on the felt, with the
      // bib pinned at the top, their result, three of their photos as prints
      // and the photographers' credit. Resolves to a JPEG blob.
      async function drawRiderCard({ year, bib, headline, detail, credits, sources }) {
        const W = 1080;
        const H = 1920;
        const ink = '#111823';
        const stock = '#f7f2e7';
        const gilt = '#c8a24a';
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        if (document.fonts) {
          await Promise.all(
            [
              'italic 400 60px "Bodoni Moda"',
              '800 150px "Libre Franklin"',
              '600 52px "Barlow Condensed"',
            ].map(font => document.fonts.load(font).catch(() => null))
          );
        }
        const images = await Promise.all(
          sources.map(
            src =>
              new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = src;
              })
          )
        );

        ctx.fillStyle = '#14392c';
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = gilt;
        ctx.lineWidth = 3;
        ctx.strokeRect(34, 34, W - 68, H - 68);

        ctx.textAlign = 'center';
        ctx.fillStyle = stock;
        ctx.font = 'italic 400 60px "Bodoni Moda", Georgia, serif';
        ctx.fillText(`Prologue Cross ${year}`, W / 2, 150);

        // The bib: white, heavy digits, a pin hole in each corner.
        const bw = 400;
        const bh = 230;
        const bx = (W - bw) / 2;
        const by = 200;
        ctx.fillStyle = '#fff';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = 'rgba(17, 24, 35, 0.45)';
        [
          [bx + 22, by + 22],
          [bx + bw - 22, by + 22],
          [bx + 22, by + bh - 22],
          [bx + bw - 22, by + bh - 22],
        ].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x, y, 7, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = ink;
        ctx.font = '800 150px "Libre Franklin", "Helvetica Neue", Arial, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(bib, W / 2, by + bh / 2 + 6);
        ctx.textBaseline = 'alphabetic';

        ctx.fillStyle = stock;
        ctx.font = '600 52px "Barlow Condensed", "Arial Narrow", sans-serif';
        if (headline) ctx.fillText(headline, W / 2, 520);
        ctx.fillStyle = gilt;
        ctx.font = '600 44px "Barlow Condensed", "Arial Narrow", sans-serif';
        if (detail) ctx.fillText(detail, W / 2, 580);

        // Each photo is a print: a stock border round a cover-cropped frame.
        const print = (img, x, y, w, h) => {
          ctx.fillStyle = stock;
          ctx.fillRect(x - 10, y - 10, w + 20, h + 20);
          const scale = Math.max(w / img.width, h / img.height);
          const sw = w / scale;
          const sh = h / scale;
          ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
        };
        const top = 650;
        const bottom = 1720;
        if (images.length === 1) {
          print(images[0], 70, top, W - 140, bottom - top);
        } else {
          const big = images.length === 2 ? 520 : 660;
          print(images[0], 70, top, W - 140, big);
          const rest = images.slice(1);
          const gap = 30;
          const w = (W - 140 - gap * (rest.length - 1)) / rest.length;
          rest.forEach((img, i) =>
            print(img, 70 + i * (w + gap), top + big + gap, w, bottom - top - big - gap)
          );
        }

        ctx.fillStyle = stock;
        ctx.font = 'italic 400 34px "Bodoni Moda", Georgia, serif';
        if (credits.length) {
          const names = new Intl.ListFormat('en', { type: 'conjunction' }).format(credits);
          ctx.fillText(`Photos by ${names}`, W / 2, 1800);
        }
        ctx.fillStyle = gilt;
        ctx.font = '600 34px "Barlow Condensed", "Arial Narrow", sans-serif';
        ctx.fillText('prologuecross.ca/photos', W / 2, 1852);

        return new Promise((resolve, reject) =>
          canvas.toBlob(
            blob => (blob ? resolve(blob) : reject(new Error('Card could not be drawn'))),
            'image/jpeg',
            0.9
          )
        );
      }

      // The race's full name, as the schedule gives it.
      function raceName(button) {
        return button.dataset.name || button.textContent.replace(/\s+/g, ' ').trim();
      }

      // The race deck: a tab per race, and under the tabs one mark per photo,
      // each race's photos spread across the column under its own tab in the
      // order they were taken. Moving along the marks previews the nearest
      // photo; choosing opens it.
      class DayTimeline {
        constructor(gallery) {
          this.gallery = gallery;
          this.root = document.querySelector('.race-deck');
          this.hint = document.querySelector('.gallery-hint');
          this.photos = [];
          this.times = [];
          this.xs = [];
          this.columns = [];
          this.lit = null;
          this.index = 0;
          this.dragging = false;
          if (!this.root) return;

          this.track = this.root.querySelector('.day-timeline-track');
          this.ticks = this.root.querySelector('.day-timeline-ticks');
          this.window = this.root.querySelector('.day-timeline-window');
          this.playhead = this.root.querySelector('.day-timeline-playhead');
          this.peek = this.root.querySelector('.day-timeline-peek');
          this.peekImage = this.peek.querySelector('img');
          this.peekTime = this.root.querySelector('.day-timeline-peek-time');
          this.peekRace = this.root.querySelector('.day-timeline-peek-race');
          this.bind();
        }

        render() {
          if (!this.root) return;
          const gallery = this.gallery;
          const races = gallery.raceButtons().filter(button => !button.hidden);
          // Shown while the year's photos are on their way, so the deck holds
          // its place instead of pushing the grid down when they land.
          const show =
            this.root.dataset.year === gallery.year &&
            races.length > 0 &&
            (gallery.fetching || gallery.allPhotos.length > 0);

          this.root.hidden = !show;
          if (this.hint) this.hint.hidden = !show || gallery.allPhotos.length === 0;
          this.hidePeek();
          this.photos = show ? gallery.allPhotos : [];
          this.times = this.photos.map(photo => Date.parse(photo.date_taken));
          this.ticks.textContent = '';
          if (!show || !this.photos.length) return;

          // Photos are in time order and races are back-to-back windows, so
          // each race's photos are one unbroken run.
          this.columns = races.map((button, i) => {
            const inRace = new Set(gallery.photosInRace(button.dataset.start));
            const first = this.photos.findIndex(photo => inRace.has(photo));
            const end = first + inRace.size;
            return {
              button,
              first,
              end,
              left: (i * 1000) / races.length,
              width: 1000 / races.length,
              earliest: this.times[first],
              latest: this.times[end - 1],
            };
          });

          // Inset from the column edges so neighbouring races do not touch.
          const inset = 0.08;
          this.xs = this.times.map(() => 0);
          this.columns.forEach(column => {
            const span = column.latest - column.earliest;
            for (let i = column.first; i < column.end; i++) {
              const along = span ? (this.times[i] - column.earliest) / span : 0.5;
              this.xs[i] = column.left + column.width * (inset + along * (1 - 2 * inset));
            }
          });

          // One line per photo, translucent, so a burst of frames stacks up
          // brighter than a lone shot.
          const svg = 'http://www.w3.org/2000/svg';
          this.xs.forEach(x => {
            const line = document.createElementNS(svg, 'line');
            line.setAttribute('x1', x.toFixed(1));
            line.setAttribute('x2', x.toFixed(1));
            line.setAttribute('y1', '0');
            line.setAttribute('y2', '100');
            this.ticks.appendChild(line);
          });

          this.index = Math.min(this.index, this.photos.length - 1);
          this.track.setAttribute('aria-valuemax', String(this.photos.length - 1));
          this.select();
        }

        // Light the selected race's marks and its column; the rest of the
        // day stays on the table, dimmed. Searching a bib lights only that
        // rider's marks, inside their race's column.
        select() {
          if (!this.root || this.root.hidden) return;

          const start = this.gallery.raceStart;
          const column = this.columns.find(c => c.button.dataset.start === start);
          this.lit = this.gallery.bib ? new Set(this.gallery.photos) : null;
          Array.from(this.ticks.children).forEach((line, i) => {
            const dim = this.lit
              ? !this.lit.has(this.photos[i])
              : Boolean(column) && (i < column.first || i >= column.end);
            line.classList.toggle('is-dim', dim);
          });
          this.window.setAttribute('x', column ? String(column.left) : '0');
          this.window.setAttribute('width', column ? String(column.width) : '0');
          this.root.classList.toggle('is-filtered', Boolean(column));
        }

        // The photo nearest a point along the strip, within the race whose
        // column the point falls in.
        indexAt(clientX) {
          const box = this.track.getBoundingClientRect();
          const x = Math.min(1, Math.max(0, (clientX - box.left) / box.width)) * 1000;
          const column =
            this.columns.find(c => x < c.left + c.width) || this.columns[this.columns.length - 1];
          // While a bib is searched, the strip snaps to that rider's photos.
          const lit = this.lit;
          const candidates = [];
          for (let i = column.first; i < column.end; i++) {
            if (!lit || lit.has(this.photos[i])) candidates.push(i);
          }
          if (!candidates.length) {
            for (let i = column.first; i < column.end; i++) candidates.push(i);
          }
          return candidates.reduce((best, i) =>
            Math.abs(this.xs[i] - x) < Math.abs(this.xs[best] - x) ? i : best
          );
        }

        show(index) {
          this.index = index;
          const photo = this.photos[index];
          const race = this.gallery.raceFor(photo);
          const share = this.xs[index] / 1000;
          const moment = this.gallery.describeMoment(photo);

          this.playhead.hidden = false;
          this.playhead.style.left = `${share * 100}%`;

          this.peek.hidden = false;
          const trackWidth = this.track.clientWidth;
          const peekWidth = this.peek.offsetWidth;
          const centre = share * trackWidth - peekWidth / 2;
          this.peek.style.left = `${Math.min(Math.max(0, centre), trackWidth - peekWidth)}px`;
          this.peekImage.src = `${this.gallery.basePath}thumbnails/${photo.filename}`;
          this.peekTime.textContent = moment;
          this.peekRace.textContent = race ? raceName(race) : '';

          this.track.setAttribute('aria-valuenow', String(index));
          this.track.setAttribute(
            'aria-valuetext',
            `${moment}, ${race ? raceName(race) : ''}, photo ${index + 1} of ${this.photos.length}`
          );
        }

        hidePeek() {
          if (!this.root) return;
          this.playhead.hidden = true;
          this.peek.hidden = true;
        }

        open() {
          this.gallery.openPhoto(this.photos[this.index]);
        }

        bind() {
          const onPeek = event => this.peek.contains(event.target);

          this.track.addEventListener('pointerdown', event => {
            if (onPeek(event) || !this.photos.length) return;
            this.dragging = true;
            if (this.track.setPointerCapture) this.track.setPointerCapture(event.pointerId);
            this.show(this.indexAt(event.clientX));
          });

          this.track.addEventListener('pointermove', event => {
            if (!this.photos.length) return;
            if (this.dragging || (event.pointerType === 'mouse' && !onPeek(event))) {
              this.show(this.indexAt(event.clientX));
            }
          });

          // A mouse picks the moment it lets go on. A finger has no hover, so
          // the preview stays put and the photo opens from the preview card.
          this.track.addEventListener('pointerup', event => {
            const wasDragging = this.dragging;
            this.dragging = false;
            if (wasDragging && event.pointerType === 'mouse') this.open();
          });

          this.track.addEventListener('pointercancel', () => {
            this.dragging = false;
          });

          this.track.addEventListener('pointerleave', event => {
            if (event.pointerType === 'mouse' && document.activeElement !== this.track) {
              this.hidePeek();
            }
          });

          // Pressing the preview would move focus off the track, and the
          // track's blur hides the preview before the click can land on it.
          this.peek.addEventListener('pointerdown', event => event.preventDefault());
          this.peek.addEventListener('click', () => this.open());

          this.track.addEventListener('focus', () => {
            if (this.photos.length) this.show(this.index);
          });
          this.track.addEventListener('blur', () => this.hidePeek());

          this.track.addEventListener('keydown', event => {
            // With the lightbox open its own arrow keys are in charge.
            const lightboxOpen = document.getElementById('lightbox').style.display === 'flex';
            if (!this.photos.length || lightboxOpen) return;
            const last = this.photos.length - 1;
            const steps = {
              ArrowRight: 1,
              ArrowUp: 1,
              ArrowLeft: -1,
              ArrowDown: -1,
              PageUp: 10,
              PageDown: -10,
            };
            let next = null;
            if (event.key in steps) next = this.index + steps[event.key];
            else if (event.key === 'Home') next = 0;
            else if (event.key === 'End') next = last;
            else if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              this.open();
              return;
            }
            if (next === null) return;
            event.preventDefault();
            this.show(Math.min(last, Math.max(0, next)));
          });
        }
      }

      function selectYear(gallery, year) {
        document.querySelectorAll('.gallery-year-btn').forEach(button => {
          button.setAttribute('aria-selected', String(button.dataset.year === year));
        });

        document.getElementById('gallery-title').textContent = `${year} Event Photos`;

        gallery.setYear(year);
      }

      // Initialize photo gallery when page loads
      document.addEventListener('DOMContentLoaded', () => {
        const defaultYear = document.querySelector('.gallery-year-btn[aria-selected="true"]')
          .dataset.year;
        const gallery = new PhotoGallery(defaultYear);

        document.querySelectorAll('.gallery-year-btn').forEach(button => {
          button.addEventListener('click', () => selectYear(gallery, button.dataset.year));
        });

        document.querySelectorAll('.gallery-race-btn').forEach(button => {
          button.addEventListener('click', () => gallery.setRace(button.dataset.start));
        });
      });
    </script>
  </body>
</html>
